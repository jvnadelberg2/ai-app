name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run format
      - run: npm run lint
      - run: npm run md
      - run: npm audit --audit-level=high
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: |
          if ls scripts/*.sh >/dev/null 2>&1; then shellcheck -x scripts/*.sh; else echo "no scripts"; fi
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: |
          PORT=3002 node server.js >/dev/null 2>&1 &
          for i in $(seq 1 50); do
            sleep 0.1
            if curl -fsS http://localhost:3002/health >/dev/null 2>&1; then break; fi
          done
          curl -fsS http://localhost:3002/health
      - run: pkill -f "node server.js" || true
