name: python-ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: nohup python -m uvicorn source.main:app --host 127.0.0.1 --port 8000 &
      - run: |
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "health check failed" && exit 1
      - run: curl -s -X POST http://127.0.0.1:8000/tasks -H 'content-type: application/json' -d '{"title":"ci task"}'
      - run: curl -s http://127.0.0.1:8000/tasks
